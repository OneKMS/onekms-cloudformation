AWSTemplateFormatVersion: "2010-09-09"
Description: OneKMS read-only discovery role for AWS KMS inventory and posture.

Parameters:
  OneKMSAccountId:
    Type: String
    Description: OneKMS AWS Account ID

  ExternalId:
    Type: String
    Description: Unique External ID generated by OneKMS

Resources:
  OneKMSReadOnlyDiscoveryRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: OneKMSReadOnlyDiscoveryRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${OneKMSAccountId}:root"
            Action: "sts:AssumeRole"
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId

      Policies:
        - PolicyName: OneKMSReadOnlyDiscoveryPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: KMSReadOnlyDiscovery
                Effect: Allow
                Action:
                  - kms:ListKeys
                  - kms:DescribeKey
                  - kms:ListAliases
                  - kms:GetKeyPolicy
                  - kms:ListKeyPolicies
                  - kms:ListResourceTags
                Resource: "*"

              - Sid: TagReadOnlyDiscovery
                Effect: Allow
                Action:
                  - tag:GetResources
                Resource: "*"

              - Sid: CloudTrailReadOnlyDiscovery
                Effect: Allow
                Action:
                  - cloudtrail:LookupEvents
                Resource: "*"

Outputs:
  RoleArn:
    Description: ARN of the OneKMS read-only discovery role
    Value: !GetAtt OneKMSReadOnlyDiscoveryRole.Arn
